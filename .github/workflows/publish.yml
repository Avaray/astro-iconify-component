name: Publish to NPM

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 1.2.0, 2.0.0-beta.1). Leave empty to use version from package.json.'
        required: false
        default: ''

jobs:
  check-version:
    name: Check Version
    runs-on: ubuntu-latest
    outputs:
      should_publish: ${{ steps.version_check.outputs.should_publish }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Bump Version (manual trigger only)
        if: github.event_name == 'workflow_dispatch' && inputs.version != ''
        run: npm version ${{ inputs.version }} --no-git-tag-version --allow-same-version

      - name: Check if Version Exists
        id: version_check
        run: |
          LOCAL_VERSION=$(jq -r '.version' package.json)
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://registry.npmjs.org/astro-iconify-component/$LOCAL_VERSION)
          if [ "$HTTP_STATUS" = "200" ]; then
            echo "Version $LOCAL_VERSION is already published. Skipping."
            echo "should_publish=false" >> $GITHUB_OUTPUT
          else
            echo "Version $LOCAL_VERSION is new. Proceeding..."
            echo "should_publish=true" >> $GITHUB_OUTPUT
          fi

  publish:
    name: Build and Publish
    needs: check-version
    if: needs.check-version.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Required for NPM Provenance attestation
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install

      - name: Build Package
        run: bun run build

      - name: Run Test Suite
        run: bun test

      - name: Publish to NPM
        run: |
          LOCAL_VERSION=$(node -p "require('./package.json').version")
          echo "Publishing version $LOCAL_VERSION..."
          PRERELEASE=""
          if [[ "$LOCAL_VERSION" == *"-"* ]]; then
            PRERELEASE="${LOCAL_VERSION#*-}"
            PRERELEASE="${PRERELEASE%%.*}"
          fi
          if [ -n "$PRERELEASE" ]; then
            echo "Prerelease detected, using --tag $PRERELEASE"
            npm publish --provenance --access public --tag "$PRERELEASE"
          else
            npm publish --provenance --access public
          fi
